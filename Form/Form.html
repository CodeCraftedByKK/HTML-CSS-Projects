<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body bgcolor="MistyRose">
    

    <form>
        <table align="center" width="700" cellpaddinig="10"> 

            <tr>
                <td colspan="2" align="center">
                 <h1>Student Registration Form</h1>    
                </td>
            </tr>


            <tr>
                <td>Student Name</td>
                <td>
                    <input type="text" size="21" placeholder="First Name">
                </td>

                <td>
                    <input type="text" size="21" placeholder="Last Name">
                </td>
            </tr>


            <tr>
                <td>Father's Name</td>
                <td>
                    <input type="text" size="21" placeholder="First Name">
                </td>

                <td>
                    <input type="text" size="21" placeholder="Last Name">
                </td>
            </tr>

            <tr>
                <td>Mother's Name</td>
                <td>
                    <input type="text" size="21" placeholder="First Name">
                </td>
                
                <td>
                    <input type="text" size="21" placeholder="Last Name">
                </td>
            </tr>

            <tr>
                <td>Date of Birth</td>
                <td>
                <input type="text" size="3" placeholder="Day">
                <input type="text" size="3" placeholder="Month">
                <input type="text" size="8" placeholder="Year">
                <i>(DD-MM-YYYY)</i>
                </td>
            </tr>


            <tr>
                <td>Mobile No.</td>
                <td><input type="text" size="1" value="+91">
                <input type="text" size="42">
                </td>
            </tr>

            <tr>
                <td>Email id: </td>
                <td>
                    <input type="text" size="50">
                </td>
            </tr>

            <tr>
                <td>Password:</td>
                <td>
                    <input type="password" size="50">
                </td>
            </tr>

            <tr>
                <td>Gender: </td>
                <td>
                    <input type="radio" name="g"> Male
                    
                    <input type="radio" name="g"> Female

                
                    <input type="radio" name="g"> Prefer Not to Say 
                </td>
            </tr>

            <tr>
                <td>Department</td>
                <td>
                    <input type="checkbox"> CSE
                    
                    <input type="checkbox"> Civil  
                    
                    <input type="checkbox"> Mechanical
                    
                    <input type="checkbox"> ECE

                    
                    <input type="checkbox"> IT
                    
                    <input type="checkbox"> Other
                </td>
            </tr>

            <tr>
                <td>Course: </td>
                <td>
                    <select>
                      
                        <option>Select Current Course </option>
                    <option>Python</option>
                    <option>Java</option>
                    <option>C#</option>
                    <option>HTML</option>
                    <option>None of the above</option>


                    </select>
                </td>
            </tr>


            <tr>
                <td>Student Photo: </td>
                <td>
                    <input type="file">
                </td>
            </tr>

            <tr>
                <td>City</td>
                <td>
                    <input type="text" size="50">
                </td>
            </tr>

            <tr>
                <td>Address: </td>
                <td>
                    <textarea cols="48" rows="5"> </textarea>
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center"> </td>
                <td>
                <input type="submit" value="Register">
                </td>
            </tr>





            



        </table>

    </form>
    
</body>
</html>
