<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even Registraion</title>
</head>
<body>
    <h1>Event Registraion</h1>

    <label for="name">Name:</label> <br>
    <input type="text" id="name" placeholder="Ajay Kumar"> <br> <br>

    <label for="email">Email: </label> <br>
    <input type="email" id="email" placeholder="Ajay123@gmail.com"> <br> <br>

    <label for="number">Phone Number: </label><br>
    <input type="number" id="number" placeholder="9896547896"><br><br>

    <label for="occupation">Choose an Occupation</label>
    <br><br>
    <select name="occupation" id="occupation"> 
        <option value="student">Student</option>
        <option value="teacher">Teacher</option>
        <option value="pilot">Pilot</option>
        <option value="farmer">Farmer</option>
        <option value="other">Others</option>

    </select>

    <p>Choose Your Interest:</p>

    <label for="python">Python</label>
    <input type="radio" id="python"> <br>
  
    <label for="html">HTML</label>
    <input type="radio" id="css"> <br>

    <label for="c">C</label>
    <input type="radio" id="c"><br>

    <textarea name="Message" id="message"></textarea>



    


</body>
</html>
